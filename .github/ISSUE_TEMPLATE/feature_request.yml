name: "Feature or Source Proposal"
description: "Suggest a new ingestion source, distillation preset, or capability for Notebook Alchemy"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new ingestion sources (e.g. Podcasts, RSS, ArXiv, Notion), topic clustering lenses, and LLM backends!
  - type: dropdown
    id: category
    attributes:
      label: "Feature Category"
      description: "Which architectural subsystem does this proposal relate to?"
      options:
        - "YouTube scanning and transcripts"
        - "Cleanup, labelling and sorting (Gemini)"
        - "The topic books"
        - "NotebookLM upload and accounts"
        - "Command-line experience"
        - "Something else"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Workflow Gap"
      description: "What pain point or workflow limitation does this solve?"
      placeholder: "When ingesting 500+ research papers or audio podcasts, we hit NotebookLM source limits before topic synthesis can occur..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: "Proposed Solution & Design"
      description: "Detailed description of how this feature should work."
      placeholder: "Add an async RSS/Audio parser that fetches Whisper transcripts and batches them into the existing Gemini Flash pipeline..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative workarounds or solutions you evaluated."
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: "Willingness to Contribute"
      options:
        - label: "I would be willing to submit a Pull Request to implement this feature."
          required: false
