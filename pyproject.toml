[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebook-alchemy"
version = "0.1.0"
description = "Orchestration and synthesis engine bridging source documents, audio overviews, and knowledge vaults."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gagexhill" }
]
keywords = ["notebooklm", "knowledge-base", "synthesis", "obsidian", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
notebook-alchemy = "notebook_alchemy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_alchemy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
