[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebook-alchemy"
dynamic = ["version"]
description = "Turn a YouTube channel into NotebookLM-ready domain compendiums."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "gagexhill" }
]
keywords = ["notebooklm", "claude", "youtube", "transcripts", "yt-dlp", "knowledge-base", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The official Claude SDK: labelling and sorting. 2.8 is the version this was built and tested with.
    "anthropic>=2.8,<3",
    # Official Google GenAI SDK: 2026 Interactions API (--watch fallback for blocked YouTube videos).
    "google-genai>=3.2.0,<4",
    # Official Python MCP SDK: dual-transport (stdio + Streamable HTTP) desktop LLM connector.
    "mcp>=2.0,<3",
    "click>=8.1.0",
    "rich>=13.0.0",
    # YouTube changes often; recent yt-dlp releases carry the fixes. [default] adds the JavaScript
    # challenge solver (yt-dlp-ejs) that YouTube extraction now needs.
    "yt-dlp[default]>=2026.10.21",
    "youtube-transcript-api>=1.2.4,<2",
    # 0.x: a minor release may remove API; Dependabot proposes the next one for review.
    # Only the `browser` extra (the sign-in window). The `cookies` extra installs rookie-cookies, which
    # reads every browser's saved sign-ins and which antivirus flags; nothing here needs it (#55).
    "notebooklm-py[browser]>=0.8.6,<0.9",
    # Minimum bound avoids known CVE-2026-112940 family in filelock 3.x pulled transitively.
    "filelock>=4.2.1,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.17,<0.18",
    "pip-audit>=2.7.0",
]

[project.scripts]
notebook-alchemy = "notebook_alchemy.cli:main"
notebook-alchemy-mcp = "notebook_alchemy.mcp_server:main"

[project.urls]
Homepage = "https://github.com/gagexhill/notebook-alchemy"
Issues = "https://github.com/gagexhill/notebook-alchemy/issues"
Source = "https://github.com/gagexhill/notebook-alchemy"

[tool.hatch.version]
path = "src/notebook_alchemy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_alchemy"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "S"]
ignore = [
    "S603", # subprocess calls (the notebooklm sign-in, the system scheduler) take an argument list,
    #         never a shell string
    "S607", # `notebooklm` is resolved from PATH on purpose: it is the installed dependency
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "BLE001", "SIM117"]
# the sample titles keep their original punctuation
"src/notebook_alchemy/mock_data.py" = ["RUF001"]
# the embedded HTML template keeps its markup on long lines
"scripts/social_preview.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
